name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node .github/check-source.mjs
      - run: git diff --check
  android:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter build apk --debug
        working-directory: apps/android
      - run: dart pub get --enforce-lockfile && dart analyze
        working-directory: packages/keybridge_protocol
  macos:
    needs: source
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      KEYBRIDGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: xcodebuild -version && bash apps/macos/build.sh
